  <!-- ตั้งธีมก่อนหน้าเว็บแสดงผล เพื่อไม่ให้หน้าจอกะพริบผิดสี -->
  <script>
    (function () {
      try {
        var d = document.documentElement, t = localStorage.getItem("tp-theme") || "system",
            l = localStorage.getItem("tp-lang"), a = localStorage.getItem("tp-accent");
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        d.dataset.theme = dark ? "dark" : "light";
        if (l) d.lang = l === "zh" ? "zh-Hans" : l;
        if (a) d.dataset.accent = a;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
